name: Phone app

# Builds the installable phone version and publishes it to GitHub Pages, which
# is what makes "Add to Home Screen" possible at all: a service worker only
# registers over https from its own origin, so the app has to be served, not
# handed over as a file.
#
# It publishes to the gh-pages branch rather than through the Pages deployment
# API. Creating a Pages site from a workflow needs a permission the repository
# token does not have here — pushing the branch enabled Pages by itself, and it
# keeps working whoever runs it.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Typecheck, bundle, then generate the service worker from the actual
      # file list of the actual build.
      - run: npm run build:mobile

      - name: Publish to gh-pages
        # A fresh single-commit history each time: the branch is build output,
        # not source, and keeping every past build of it would grow the
        # repository for nothing.
        run: |
          touch dist-mobile/.nojekyll
          cd dist-mobile
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish the phone app from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
