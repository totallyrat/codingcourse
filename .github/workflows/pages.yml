name: Phone app

# Builds the installable phone version and publishes it to GitHub Pages, which
# is what makes "Add to Home Screen" possible at all: a service worker only
# registers over https from its own origin, so the app has to be served, not
# handed over as a file.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run should replace an older one rather
# than race it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Typecheck, bundle, then generate the service worker from the actual
      # file list of the actual build.
      - run: npm run build:mobile

      - name: Configure Pages
        # `enablement` turns Pages on for the repository the first time this
        # runs, so publishing does not depend on somebody visiting a settings
        # page first.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-mobile

      - id: deploy
        uses: actions/deploy-pages@v4
